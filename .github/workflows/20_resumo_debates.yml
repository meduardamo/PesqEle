name: 20 - Resumo de Debates

# Roda depois da transcrição e só quando alguém pede: o resumo lê o CSV que o
# workflow 19 já subiu para o Drive e chama o modelo uma vez por tema, então
# custa dinheiro por rodada. Sem agendamento de propósito, pelo mesmo motivo
# que a transcrição não tem.
on:
  schedule:
    - cron: '47 * * * *'   # Roda de hora em hora (no minuto 47)
  workflow_dispatch:
    inputs:
      id:
        description: 'Id do debate na planilha (vazio = todos os que estão "pronto" e ainda não têm resumo)'
        required: false
        default: ''
      sabatina:
        description: 'É uma sabatina? (usa aba "sabatinas")'
        type: boolean
        required: false
        default: false

      eixos:
        description: 'Quantos temas ganham parágrafo próprio'
        required: false
        default: '6'
      sem_modelo:
        description: 'Só a parte medida (duração, tempo de fala, minutos por tema), sem chamar a API'
        type: boolean
        required: false
        default: false
      drive:
        description: 'Sobe o resumo como Doc e grava o link na planilha'
        type: boolean
        required: false
        default: true
      refazer:
        description: 'Gera de novo mesmo para debate que já tem resumo (sobe arquivo novo)'
        type: boolean
        required: false
        default: false
      sem_email:
        description: 'Não avisa a lista por email que saiu resumo novo'
        type: boolean
        required: false
        default: false
      testar_email:
        description: 'Só manda um aviso de teste para a lista e sai (não gera resumo nenhum)'
        type: boolean
        required: false
        default: false
      modelo:
        description: 'Modelo Gemini'
        required: false
        default: 'gemini-3.6-flash'
      preencher_texto:
        description: 'Só copiar para a planilha o texto dos resumos que já estão no Drive (não chama o modelo)'
        type: boolean
        required: false
        default: false
      preencher_meta:
        description: 'Só medir de novo os eventos que já têm resumo, para o sumário do painel (não chama o modelo)'
        type: boolean
        required: false
        default: false

  repository_dispatch:
    types: [resumir-debates]

# O resumo escreve na mesma planilha que a transcrição, e duas rodadas ao mesmo
# tempo brigariam pela mesma linha.
concurrency:
  group: resumo-debates
  cancel-in-progress: false

jobs:
  resumir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pymupdf e pandas entram pelo mesmo motivo do workflow 19: o dicionário
      # de assuntos importa o analise_planos, que importa os dois no topo.
      - run: pip install google-genai gspread google-auth google-api-python-client pymupdf pandas "brevo-python==1.1.2"

      - name: Escrever credentials.json
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      # O painel lê o texto do resumo da planilha, e os resumos gerados antes
      # da coluna existir estão só no Drive. Este passo copia o texto deles sem
      # chamar o modelo; é rodado uma vez e depois fica ocioso.
      - name: Preencher o texto dos resumos antigos
        if: inputs.preencher_texto == true
        env:
          PYTHONUNBUFFERED: "1"
          SPREADSHEET_ID_DEBATES: ${{ secrets.SPREADSHEET_ID_DEBATES }}
          PASTA_DRIVE_DEBATES: ${{ secrets.PASTA_DRIVE_DEBATES }}
        run: python -m outros.resumo_debates --preencher-texto

      # A medição que vira o sumário do painel. Também não chama o modelo: a
      # conta sai do CSV que já está no Drive.
      - name: Medir os eventos para o sumário
        if: inputs.preencher_meta == true
        env:
          PYTHONUNBUFFERED: "1"
          SPREADSHEET_ID_DEBATES: ${{ secrets.SPREADSHEET_ID_DEBATES }}
          PASTA_DRIVE_DEBATES: ${{ secrets.PASTA_DRIVE_DEBATES }}
        run: python -m outros.resumo_debates --preencher-meta

      # Confere a configuração do email (chave da Brevo, remetente, lista) sem
      # gerar resumo nenhum: o caminho do aviso só roda quando sai resumo novo,
      # e aí já é tarde para descobrir que a chave venceu.
      - name: Testar o aviso por email
        if: inputs.testar_email == true
        env:
          PYTHONUNBUFFERED: "1"
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          DESTINATARIOS_DEBATES: ${{ secrets.DESTINATARIOS_DEBATES }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          # Só leitura: o exemplo do teste é o último evento que já tem resumo,
          # para o email de teste sair com o link do Doc de verdade.
          SPREADSHEET_ID_DEBATES: ${{ secrets.SPREADSHEET_ID_DEBATES }}
        run: python -m outros.resumo_debates --testar-email

      - name: Gerar os resumos
        if: inputs.preencher_texto != true && inputs.preencher_meta != true && inputs.testar_email != true
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.modelo || 'gemini-3.6-flash' }}
          SPREADSHEET_ID_DEBATES: ${{ secrets.SPREADSHEET_ID_DEBATES }}
          PASTA_DRIVE_DEBATES: ${{ secrets.PASTA_DRIVE_DEBATES }}
          # Aviso de rodada para a lista. Sem BREVO_API_KEY/EMAIL a rodada
          # segue igual, só não manda nada. DESTINATARIOS_DEBATES é a lista
          # desta rotina; sem ela cai na geral (DESTINATARIOS).
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          DESTINATARIOS_DEBATES: ${{ secrets.DESTINATARIOS_DEBATES }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: |
          python -m outros.resumo_debates --fila \
            ${{ inputs.sabatina == true && '--sabatina' || '' }} \
            ${{ inputs.id && format('--id {0}', inputs.id) || '' }} \
            --eixos ${{ inputs.eixos || '6' }} \
            ${{ inputs.refazer == true && '--refazer' || '' }} \
            ${{ inputs.sem_modelo == true && '--sem-modelo' || '' }} \
            ${{ inputs.sem_email == true && '--sem-email' || '' }} \
            ${{ (inputs.drive == true || github.event_name == 'repository_dispatch' || github.event_name == 'schedule') && '--drive' || '' }}

      - name: Resumo na página do run
        if: always()
        run: |
          {
            echo "## Resumo de debates"
            echo ""
            if compgen -G "transcricoes/*_resumo.md" > /dev/null; then
              for f in transcricoes/*_resumo.md; do
                echo "### $(basename "$f")"
                echo ""
                cat "$f"
                echo ""
              done
            else
              echo "Nenhum resumo gerado. Veja o log do passo anterior."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar arquivos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumos-${{ github.run_number }}
          path: transcricoes/*_resumo.md
          retention-days: 30
          if-no-files-found: warn

name: 26 - Aferir repergunta em "Propõe ação"

# Manual, e roda uma vez. Mede quanto reperguntar corrige nas 20 linhas que a
# leitura de 250 citações aleatórias marcou como "Propõe ação" sem ação nenhuma
# na citação. Serve para decidir se vale a leva inteira nos 207 planos: se
# reperguntar corrigir 3 de 20, não vale.
#
# NÃO ESCREVE NA PLANILHA. Só lê os PDFs e imprime o antes e o depois.

on:
  workflow_dispatch:

# Mesmo grupo do 14 e do 23, que é onde a planilha de planos é escrita. Este
# não escreve, mas baixa os mesmos PDFs e não custa nada esperar a fila.
concurrency:
  group: planos-governo
  cancel-in-progress: false

jobs:
  aferir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: OCR (planos digitalizados)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      # pandas entra porque analise_planos importa no topo, mesmo sem usar aqui.
      - run: pip install google-genai PyMuPDF pillow pytesseract pandas

      - name: Aferir
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m outros.aferir_acao

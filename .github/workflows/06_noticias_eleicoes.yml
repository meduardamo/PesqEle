name: 06 - Notícias eleições

on:
  # Disparo externo, em horario exato. O cron agendado do Actions entra numa
  # fila de baixa prioridade e atrasa de 25 a 250 min (medido em 12 dias), o que
  # nao serve pro time, que levanta noticia as 7h, 12h e 16h. Um agendador de
  # fora (cron-job.org) chama POST /repos/meduardamo/eixo-eleicoes/dispatches
  # com {"event_type": "raspar-noticias"} e o run comeca em segundos.
  # Os crons de rede de seguranca sairam em 27/08/2026: rodavam junto com o
  # disparo externo e mandavam um segundo email no mesmo intervalo de tempo.
  # Se o agendador externo cair, devolver aqui: '15 7 * * *', '15 12 * * *' e
  # '15 16 * * *' (UTC, duas horas antes do horario-alvo).
  repository_dispatch:
    types: [raspar-noticias]

  workflow_dispatch:        # permite rodar manualmente pelo GitHub

# Uma rodada por vez. Sao 3 disparos externos por dia, mais o manual. Se duas
# rodadas se sobrepuserem, as duas leem carregar_titulos_existentes() antes de
# qualquer uma gravar, e as duas inserem as mesmas noticias: a deduplicacao por
# titulo nao protege contra execucao simultanea. Com cancel-in-progress false a
# segunda espera a primeira terminar e ai le a planilha ja atualizada.
concurrency:
  group: noticias-eleicoes
  cancel-in-progress: false

jobs:
  scraper:
    runs-on: ubuntu-latest
    # Rodada normal fica em ~10 min. Se passar de 45, alguma coisa saiu do
    # trilho (foi assim na rodada de 30/07, que reclassificou a planilha inteira
    # por 4h e morreu sem salvar) e é melhor cortar do que segurar a fila.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install requests google-genai gspread google-auth "newspaper3k==0.2.8" "lxml[html_clean]==5.2.2" googlenewsdecoder "brevo-python==1.1.2"

      - name: Rodar scraper
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
          SPREADSHEET_ID_SITES: ${{ secrets.SPREADSHEET_ID_SITES }}
          # email de alerta pós-rodada. Sem BREVO_API_KEY/EMAIL a rodada segue
          # igual, só não envia. DESTINATARIOS_NOTICIAS é opcional: sem ele cai
          # na lista geral (DESTINATARIOS), a mesma do alerta de pesquisas.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          DESTINATARIOS_NOTICIAS: ${{ secrets.DESTINATARIOS_NOTICIAS }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
        run: python -u -m outros.noticias_eleicoes_scraper

name: 15 - Instagram Coleta

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link do post ou perfil do Instagram (deixe em branco para rodar --perfis)"
        required: false
        default: ""
      data_minima:
        description: "Data mínima (YYYY-MM-DD)"
        required: false
        default: ""
      limite_perfis:
        description: "Limite de perfis (apenas no modo --perfis)"
        required: false
        default: ""
      pular_perfis:
        description: "Pula os N primeiros perfis, para rodar backfill em lotes (apenas no modo --perfis)"
        required: false
        default: ""
      so_relatorio:
        description: "So o e-mail com o clipping do que ja esta gravado, sem coletar nada (data opcional em data_minima)"
        type: boolean
        required: false
        default: false
  # Unico gatilho automatico: cron-job.org chama POST
  # /repos/meduardamo/eixo-eleicoes/dispatches com
  # {"event_type": "coletar-instagram"} todo dia as 15:00 (America/Recife) e o
  # run comeca em segundos, contra 25 a 250 min de atraso do cron agendado do
  # Actions (medido em 12 dias no workflow 06).
  # Sem client_payload: a rodada externa cai no modo --perfis.
  #
  # Sem cron de rede de seguranca, de proposito (decisao dela, 31/07/2026): cada
  # rodada chama a Apify para os 79 perfis antes de deduplicar, entao uma rodada
  # de reserva custaria a coleta em dobro todo dia. Se o disparo externo falhar,
  # o aviso vem do "execution of the cronjob fails" do cron-job.org e a rodada
  # se refaz no workflow_dispatch.
  repository_dispatch:
    types: [coletar-instagram]

# Uma rodada por vez. Disparo externo e rodada manual podem se sobrepor; as duas
# leem os posts ja processados antes de qualquer uma gravar e a deduplicacao por
# ID de post nao protege contra execucao simultanea.
concurrency:
  group: instagram-coleta
  cancel-in-progress: false

jobs:
  executar-script:
    runs-on: ubuntu-latest
    # Desde 05/08/2026 este workflow so coleta e manda o clipping; o Gemini saiu
    # daqui para o 16 - Instagram Analise. A rodada de 05/08 gastou 11 min na
    # Apify e 189 min no post a post do Gemini, estourou o teto de 200 min no
    # perfil 74 de 79 e o e-mail nem chegou a sair. So a coleta cabe em ~15 min.
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar credenciais Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "Secret GOOGLE_CREDENTIALS_JSON não configurado no repositório."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "
          import json, os
          d = json.load(open('credentials.json', encoding='utf-8'))
          d['GEMINI_API_KEY'] = os.environ['GEMINI_API_KEY']
          json.dump(d, open('credentials.json', 'w', encoding='utf-8'))
          print('credentials.json válido')
          "

      - name: Executar script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SHEET_ID_INSTAGRAM }}
          SPREADSHEET_ID_PERFIS: ${{ secrets.SHEET_ID_INSTAGRAM_PERFIS }}
          # Relatorio do fim da rodada: e-mail com os numeros por UF e por cargo
          # e o clipping em PDF anexado. Mesmo remetente do alerta de pesquisas
          # (workflow 02). Sem DESTINATARIOS_INSTAGRAM cai em DESTINATARIOS; sem
          # nenhum dos dois o script avisa no log e nao envia.
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          DESTINATARIOS_INSTAGRAM: ${{ secrets.DESTINATARIOS_INSTAGRAM }}
          DESTINATARIOS: ${{ secrets.DESTINATARIOS }}
          LINK: ${{ inputs.link }}
          DATA_MINIMA: ${{ inputs.data_minima }}
          LIMITE_PERFIS: ${{ inputs.limite_perfis }}
          PULAR_PERFIS: ${{ inputs.pular_perfis }}
          SO_RELATORIO: ${{ inputs.so_relatorio }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "Secret APIFY_TOKEN não configurado no repositório."
            exit 1
          fi

          ARGS=()
          # Refaz so o e-mail com o clipping do que ja esta na aba Resultados.
          # A coleta e a parte cara (a Apify cobra pelos 79 perfis), entao
          # reenviar o clipping do dia nao passa por ela.
          if [ "$SO_RELATORIO" = "true" ]; then
            python outros/instagram.py --relatorio $DATA_MINIMA
            exit $?
          fi

          if [ -n "$LINK" ]; then
            ARGS+=("$LINK")
            [ -n "$DATA_MINIMA" ] && ARGS+=("$DATA_MINIMA")
          else
            # Sem data no modo --perfis o script chama input() e morre com
            # EOFError, porque o runner nao tem terminal. O disparo do
            # cron-job.org nao manda payload, entao a data precisa de um padrao
            # aqui: janela de 2 dias, que cobre a rodada que falhou no dia
            # anterior. Post ja gravado e pulado pelo ID, entao a janela maior
            # nao duplica linha.
            if [ -z "$DATA_MINIMA" ]; then
              DATA_MINIMA="$(date -u -d '2 days ago' +%F)"
              echo "Sem data informada, usando janela padrao a partir de $DATA_MINIMA."
            fi
            ARGS+=(--perfis "$DATA_MINIMA")
            # O script le limite e pular por posicao, entao pular so chega se o
            # limite vier antes. Limite 0 e o mesmo que "sem limite".
            if [ -n "$PULAR_PERFIS" ]; then
              ARGS+=("${LIMITE_PERFIS:-0}" "$PULAR_PERFIS")
            elif [ -n "$LIMITE_PERFIS" ]; then
              ARGS+=("$LIMITE_PERFIS")
            fi
          fi

          python outros/instagram.py "${ARGS[@]}"

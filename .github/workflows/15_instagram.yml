name: 15 - Instagram Coleta

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Link do post ou perfil do Instagram (deixe em branco para rodar --perfis)"
        required: false
        default: ""
      data_minima:
        description: "Data mínima (YYYY-MM-DD)"
        required: false
        default: ""
      limite_perfis:
        description: "Limite de perfis (apenas no modo --perfis)"
        required: false
        default: ""
  schedule:
    - cron: "0 18 * * *"

jobs:
  executar-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar credenciais Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "Secret GOOGLE_APPLICATION_CREDENTIALS_JSON não configurado no repositório."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "import json; json.load(open('credentials.json', encoding='utf-8')); print('credentials.json válido')"

      - name: Executar script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SHEET_ID_INSTAGRAM }}
          SPREADSHEET_ID_PERFIS: ${{ secrets.SHEET_ID_INSTAGRAM_PERFIS }}
          LINK: ${{ inputs.link }}
          DATA_MINIMA: ${{ inputs.data_minima }}
          LIMITE_PERFIS: ${{ inputs.limite_perfis }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "Secret APIFY_TOKEN não configurado no repositório."
            exit 1
          fi

          ARGS=()
          if [ -n "$LINK" ]; then
            ARGS+=("$LINK")
            [ -n "$DATA_MINIMA" ] && ARGS+=("$DATA_MINIMA")
          else
            ARGS+=(--perfis)
            [ -n "$DATA_MINIMA" ] && ARGS+=("$DATA_MINIMA")
            [ -n "$LIMITE_PERFIS" ] && ARGS+=("$LIMITE_PERFIS")
          fi

          python instagram.py "${ARGS[@]}"

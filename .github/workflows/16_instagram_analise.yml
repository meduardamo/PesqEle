name: 16 - Instagram Análise

# Fase 2 da rodada do Instagram: roda o Gemini nas linhas que o 15 - Instagram
# Coleta gravou com as colunas de análise em branco.
#
# Separado do 15 desde 05/08/2026. Numa execução só, o post a post do Gemini
# estourava o timeout e levava junto o clipping do dia, que nem chegava a ser
# enviado. Aqui o pior caso é a análise ficar pela metade: as linhas continuam
# pendentes na planilha e a rodada do dia seguinte pega o resto sozinha.
on:
  # Engatado no fim da coleta, e não num cron proprio: assim ele acompanha o
  # horario real do 15, que e disparado pelo cron-job.org.
  workflow_run:
    workflows: ["15 - Instagram Coleta"]
    types: [completed]
  workflow_dispatch:
    inputs:
      limite:
        description: "Máximo de posts a analisar nesta rodada (em branco = todos os pendentes)"
        required: false
        default: ""
      resolucao_baixa:
        description: "Manda o vídeo em resolução baixa (66 tokens/frame em vez de 258, custo cai a cerca de 1/3)"
        type: boolean
        required: false
        default: false

# Duas execuções ao mesmo tempo pegariam a mesma lista de linhas pendentes e
# analisariam (e pagariam) o mesmo post duas vezes.
concurrency:
  group: instagram-analise
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Em paralelo (THREADS_ANALISE), os 543 posts de um dia cheio levam algo
    # perto de 30 min. O teto largo cobre um acumulo de dias pendentes.
    timeout-minutes: 200
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar credenciais Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "Secret GOOGLE_CREDENTIALS_JSON não configurado no repositório."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "
          import json, os
          d = json.load(open('credentials.json', encoding='utf-8'))
          d['GEMINI_API_KEY'] = os.environ['GEMINI_API_KEY']
          json.dump(d, open('credentials.json', 'w', encoding='utf-8'))
          print('credentials.json válido')
          "

      - name: Analisar pendentes
        env:
          SPREADSHEET_ID: ${{ secrets.SHEET_ID_INSTAGRAM }}
          SPREADSHEET_ID_PERFIS: ${{ secrets.SHEET_ID_INSTAGRAM_PERFIS }}
          RESOLUCAO_MIDIA_BAIXA: ${{ inputs.resolucao_baixa }}
        run: |
          ARGS=()
          [ -n "$LIMITE" ] && ARGS+=(--analise "$LIMITE") || ARGS+=(--analise)
          python outros/instagram.py "${ARGS[@]}"

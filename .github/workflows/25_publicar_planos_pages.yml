name: 25 - Publicar Planos no GitHub Pages

on:
  schedule:
    # Roda logo após o espelhamento (workflow 24 roda 04:40). 
    # Colocando 05:40 para garantir que o espelho já terminou.
    - cron: '40 5 * * *'

  repository_dispatch:
    types: [publicar-planos-pages]

  workflow_dispatch:

concurrency:
  group: publicar-planos-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout código (eixo-eleicoes)
        uses: actions/checkout@v4
        with:
          path: codigo

      - name: Checkout site (planos-governo-2026)
        uses: actions/checkout@v4
        with:
          repository: eleicoes2026-dados/planos-governo-2026
          token: ${{ secrets.PAT_GITHUB }}
          path: site

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install gspread google-auth google-api-python-client PyMuPDF pandas curl_cffi

      - name: Escrever credentials.json
        working-directory: codigo
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Baixar PDFs e montar árvore do site
        working-directory: codigo
        env:
          PYTHONUNBUFFERED: "1"
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
        run: |
          python -m outros.publicar_planos_pages \
            --destino ../site \
            --credenciais credentials.json

      - name: Commit e push
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos PDFs."
          else
            git commit -m "Atualiza PDFs dos planos de governo"
            git push
          fi

name: 12 - TSE Atas

# Desativado em 19/08/2026: o período de convenções partidárias já foi encerrado.
# on:
#   schedule:
#     - cron: '40 * * * *'
on:
  workflow_dispatch:

# Rodada agendada atrasa (o Actions enfileira de 25 a 250 min) e pode alcançar a
# da hora seguinte. Duas gravando a mesma aba é o 409 do Sheets, que em
# 06/08/2026 deixou a aba de candidaturas vazia no workflow 10. A fila resolve na
# origem; a corrente não é cancelada para não perder PDF de ata já baixado.
concurrency:
  group: tse-atas
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install gspread requests pandas pymupdf

      - name: Escrever credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - run: python -m outros.tse_atas
        env:
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}

name: 10 - TSE

on:
  schedule:
    # O DivulgaCand diz atualizar de hora em hora, então acompanhamos no mesmo
    # ritmo. A coleta é só API, sem Gemini: 28 UEs por cargo, resposta em
    # milissegundos, custo zero. Minuto fora do :00 porque é quando o Actions
    # mais enfileira as rodadas agendadas.
    - cron: '25 * * * *'
  workflow_dispatch:

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install gspread requests pandas

      - name: Escrever credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - run: python -m outros.tse_candidaturas
        env:
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
          # Planilha de trabalho da equipe ("Eleições 2026 - Nomes competitivos"),
          # onde a aba de candidatos a deputado federal é reescrita a cada rodada,
          # e a da legislatura atual (deputados_completo_assPEC), de onde sai a
          # marcação de reeleição. Faltando qualquer um dos dois, a exportação
          # avisa no log e a coleta segue normal.
          SPREADSHEET_ID_COMPETITIVOS: ${{ secrets.SPREADSHEET_ID_COMPETITIVOS }}
          SPREADSHEET_ID_DEPUTADOS_ATUAIS: ${{ secrets.SPREADSHEET_ID_DEPUTADOS_ATUAIS }}

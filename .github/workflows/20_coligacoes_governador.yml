name: 20 - Coligações para governador

on:
  schedule:
    # 19h30 em Recife. A última rodada é em 17/08/2026; depois da tentativa
    # final o próprio workflow se desativa, mesmo se a coleta falhar.
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: coligacoes-governador
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar janela de execução
        id: janela
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          HOJE=$(TZ=America/Recife date +%F)
          echo "Data em Recife: $HOJE"
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "executar=true" >> "$GITHUB_OUTPUT"
            echo "finalizar=false" >> "$GITHUB_OUTPUT"
          elif [[ "$HOJE" > "2026-08-17" ]]; then
            echo "executar=false" >> "$GITHUB_OUTPUT"
            echo "finalizar=true" >> "$GITHUB_OUTPUT"
          elif [[ "$HOJE" == "2026-08-17" ]]; then
            echo "executar=true" >> "$GITHUB_OUTPUT"
            echo "finalizar=true" >> "$GITHUB_OUTPUT"
          else
            echo "executar=true" >> "$GITHUB_OUTPUT"
            echo "finalizar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar o código
        if: steps.janela.outputs.executar == 'true'
        uses: actions/checkout@v4

      - name: Configurar Python
        if: steps.janela.outputs.executar == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        if: steps.janela.outputs.executar == 'true'
        run: pip install gspread requests

      - name: Escrever credenciais do Google
        if: steps.janela.outputs.executar == 'true'
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json

      - name: Atualizar coligações de governador
        if: steps.janela.outputs.executar == 'true'
        env:
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
          PYTHONUNBUFFERED: "1"
        run: python -u -m outros.coligacoes_governador

      - name: Desativar após a última atualização
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          steps.janela.outputs.finalizar == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "/repos/$GITHUB_REPOSITORY/actions/workflows/20_coligacoes_governador.yml/disable"

name: 23 - Auditar planos gravados

# Manual, e de propósito. Passa as guardas da análise sobre o que já está na
# planilha, chamando a mesma conferir_classificacao da produção. Existe porque
# guarda que entra sem a VERSAO_ANALISE subir junto nunca alcança o que já foi
# gravado, e a base fica com dois critérios convivendo.
#
# Comece por "contar": ele não chama o modelo e diz o tamanho antes de gastar.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'O que fazer'
        type: choice
        options:
          - contar
          - simular
          - gravar
          - atribuicao
        default: contar
      amostra:
        description: 'Só no modo atribuicao: quantas linhas medir'
        required: false
        default: '150'
      planos:
        description: 'Quantos planos (0 = base inteira)'
        required: false
        default: '0'
      uf:
        description: 'Restringe a uma UF (vazio = todas)'
        required: false
        default: ''

# O mesmo grupo do workflow 14, porque os dois escrevem em analise_planos e o 14
# escreve pela reescrita da aba inteira (clear + update, que não é atômico). Sem
# a fila, uma correção gravada aqui por batch_update cai dentro da janela do
# clear de lá e some, que é o modo como o Ciro Gomes sumiu da aba em 28/07/2026.
# Auditoria em modo contar não escreve, mas fica na fila junto: o custo é
# esperar, e o de errar é dado perdido.
concurrency:
  group: planos-governo
  cancel-in-progress: false

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: OCR (planos digitalizados)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      - run: pip install gspread google-auth google-genai PyMuPDF pillow pytesseract pandas

      - name: Escrever credentials.json
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Auditar
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
        run: |
          python -m outros.auditar_planos \
            --planos ${{ inputs.planos }} \
            ${{ inputs.uf && format('--uf {0}', inputs.uf) || '' }} \
            ${{ inputs.modo == 'contar' && '--contar' || '' }} \
            ${{ inputs.modo == 'gravar' && '--gravar' || '' }} \
            ${{ inputs.modo == 'atribuicao' && format('--atribuicao {0}', inputs.amostra) || '' }}

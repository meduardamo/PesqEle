name: 21 - Alinhamento Temático

on:
  workflow_dispatch:
    inputs:
      candidato:
        description: "Candidato para piloto (vazio = todos)"
        required: false
        default: ""
      forcar:
        description: "Refazer resultados já preenchidos"
        type: boolean
        required: true
        default: true

concurrency:
  group: alinhamento-tematico
  cancel-in-progress: false

jobs:
  classificar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: America/Recife

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar credenciais
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "import json,os; p='credentials.json'; d=json.load(open(p)); d['GEMINI_API_KEY']=os.environ['GEMINI_API_KEY']; json.dump(d,open(p,'w'))"

      - name: Classificar
        env:
          SPREADSHEET_ID: ${{ secrets.SHEET_ID_INSTAGRAM }}
          CANDIDATO: ${{ inputs.candidato }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          ARGS=()
          [ -n "$CANDIDATO" ] && ARGS+=(--candidato "$CANDIDATO")
          [ "$FORCAR" = "true" ] && ARGS+=(--forcar)
          python outros/alinhamento-tematico/classificar.py "${ARGS[@]}"

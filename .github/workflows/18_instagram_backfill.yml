name: 18 - Instagram Backfill

# Tapa as linhas que a fase 1 gravou sem "URL da mídia".
#
# A fase 2 (16 - Instagram Análise) só enxerga linha que tem a URL do CDN
# gravada. Linha sem URL nunca entra na fila e fica sem análise para sempre,
# sem aparecer como erro em rodada nenhuma. Foi o que aconteceu em 06/08/2026,
# a primeira rodada depois da separação entre coleta e análise: 638 dos 643
# posts do dia ficaram parados.
#
# Sem cron de propósito. É rodada de passivo, disparada na mão quando o aviso
# do 16 apontar linhas órfãs.
on:
  workflow_dispatch:
    inputs:
      aba:
        description: "Aba mensal a tapar (em branco = mês atual)"
        required: false
        default: ""
      limite:
        description: "Máximo de posts nesta rodada (use 5 para o piloto)"
        required: false
        default: ""
      so_listar:
        description: "Só lista o que seria feito, não escreve na planilha"
        type: boolean
        required: false
        default: false

# Duas execuções ao mesmo tempo pegariam a mesma lista de linhas órfãs e
# pagariam Apify e Gemini duas vezes pelo mesmo post.
concurrency:
  group: instagram-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    # O passivo de agosto são 679 posts, quase todos vídeo. Em paralelo
    # (THREADS_ANALISE) o 16 leva perto de 30 min para 543 posts de um dia
    # cheio, e aqui entra ainda a recoleta na Apify.
    timeout-minutes: 200
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Preparar credenciais Google
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GOOGLE_CREDENTIALS_JSON" ]; then
            echo "Secret GOOGLE_CREDENTIALS_JSON não configurado no repositório."
            exit 1
          fi
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          python -c "
          import json, os
          d = json.load(open('credentials.json', encoding='utf-8'))
          d['GEMINI_API_KEY'] = os.environ['GEMINI_API_KEY']
          json.dump(d, open('credentials.json', 'w', encoding='utf-8'))
          print('credentials.json válido')
          "

      - name: Rodar backfill
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SPREADSHEET_ID: ${{ secrets.SHEET_ID_INSTAGRAM }}
          SPREADSHEET_ID_PERFIS: ${{ secrets.SHEET_ID_INSTAGRAM_PERFIS }}
          # Pelo ambiente, e não interpolado no script: input de workflow é
          # texto livre e viraria injeção de shell no meio da linha de comando.
          ABA_BACKFILL: ${{ inputs.aba }}
          ENTRADA_LIMITE: ${{ inputs.limite }}
          ENTRADA_SO_LISTAR: ${{ inputs.so_listar }}
        run: |
          ARGS=()
          if [ -n "$ENTRADA_LIMITE" ]; then
            ARGS+=(--limite "$ENTRADA_LIMITE")
          fi
          if [ "$ENTRADA_SO_LISTAR" = "true" ]; then
            ARGS+=(--so-listar)
          fi
          python outros/instagram_backfill.py "${ARGS[@]}"

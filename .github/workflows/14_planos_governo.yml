name: 14 - Planos de Governo

on:
  schedule:
    # Três vezes ao dia, e não mais de hora em hora. De hora em hora só fazia
    # sentido enquanto o script apagava a própria gravação e reprocessava os
    # mesmos sete planos: em 09/08/2026 a rodada das 20:18 caiu nas linhas 1722
    # a 1936 de analise_planos, em cima de cinco candidatos, e o Lula sumiu do
    # painel depois de analisado. Com a gravação consertada, plano novo entra
    # uma vez e fica, então o que manda é o ritmo de quem lê o painel.
    #
    # GitHub Actions usa UTC; Brasil/Recife = UTC-3. Minuto fora do :00 porque o
    # :00 é quando o Actions mais enfileira, e duas horas antes do horário-alvo
    # porque cron agendado é fila de baixa prioridade: no workflow 06, medido em
    # 12 dias, o atraso foi de 25 min no melhor caso, 89 na mediana e 250 no
    # pior. Neste aqui, em 09/08, ficou entre 18 e 34 min.
    - cron: '22 8 * * *'   # 05:22 BRT, alvo 07:00
    - cron: '22 14 * * *'  # 11:22 BRT, alvo 13:00
    - cron: '22 20 * * *'  # 17:22 BRT, alvo 19:00

  # Disparo externo, em horário exato, pelo mesmo agendador que já chama os
  # workflows 06, 08 e 15: POST /repos/meduardamo/eixo-eleicoes/dispatches com
  # {"event_type": "analisar-planos"} e o run começa em segundos. Os crons acima
  # ficam como rede de segurança. Rodar duas vezes não duplica nada: a fila é
  # calculada por versão e link, e a gravação dedupe por (candidato, tema).
  repository_dispatch:
    types: [analisar-planos]

  workflow_dispatch:
    inputs:
      uf:
        description: 'Restringe a uma UF (vazio = todas)'
        required: false
        default: ''
      forcar:
        description: 'Reprocessa mesmo quem já está gravado e atualizado'
        type: boolean
        required: false
        default: false

# Duas execuções gravando na mesma planilha se atrapalham. A fila garante uma de
# cada vez, e a corrente não é cancelada para não jogar fora análise já paga.
concurrency:
  group: planos-governo
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # o runner corta em 6h; para antes com folga
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: OCR (planos digitalizados)
        # Sem tesseract, plano escaneado volta vazio e parece que o candidato
        # não escreveu nada.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      - run: pip install gspread google-auth google-genai PyMuPDF pillow pytesseract pandas

      - name: Escrever credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Analisar planos
        env:
          PYTHONUNBUFFERED: "1"     # sem isso o log só aparece no fim
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
        run: |
          python -m outros.processar_planos \
            --cargo TODOS \
            ${{ inputs.uf && format('--uf {0}', inputs.uf) || '' }} \
            ${{ inputs.forcar == true && '--forcar' || '' }}

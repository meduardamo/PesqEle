name: 14 - Planos de Governo

on:
  schedule:
    # Três vezes ao dia, e não mais de hora em hora. De hora em hora só fazia
    # sentido enquanto o script apagava a própria gravação e reprocessava os
    # mesmos sete planos: em 09/08/2026 a rodada das 20:18 caiu nas linhas 1722
    # a 1936 de analise_planos, em cima de cinco candidatos, e o Lula sumiu do
    # painel depois de analisado. Com a gravação consertada, plano novo entra
    # uma vez e fica, então o que manda é o ritmo de quem lê o painel.
    #
    # GitHub Actions usa UTC; Brasil/Recife = UTC-3. Minuto fora do :00 porque o
    # :00 é quando o Actions mais enfileira, e duas horas antes do horário-alvo
    # porque cron agendado é fila de baixa prioridade: no workflow 06, medido em
    # 12 dias, o atraso foi de 25 min no melhor caso, 89 na mediana e 250 no
    # pior. Neste aqui, em 09/08, ficou entre 18 e 34 min.
    # Roda sempre às :35, para dar tempo do workflow 24 (Espelho) finalizar (inicia às :20).
    - cron: '35 8 * * *'   # 05:35 BRT
    - cron: '35 14 * * *'  # 11:35 BRT
    - cron: '35 20 * * *'  # 17:35 BRT

  # Disparo externo, em horário exato, pelo mesmo agendador que já chama os
  # workflows 06, 08 e 15: POST /repos/meduardamo/eixo-eleicoes/dispatches com
  # {"event_type": "analisar-planos"} e o run começa em segundos. Os crons acima
  # ficam como rede de segurança. Rodar duas vezes não duplica nada: a fila é
  # calculada por versão e link, e a gravação dedupe por (candidato, tema).
  repository_dispatch:
    types: [analisar-planos]

  workflow_dispatch:
    inputs:
      uf:
        description: 'Restringe a uma UF (vazio = todas)'
        required: false
        default: ''
      sq:
        description: 'Restringe a um SQ_CANDIDATO (vazio = todos)'
        required: false
        default: ''
      forcar:
        description: 'Reprocessa mesmo quem já está gravado e atualizado'
        type: boolean
        required: false
        default: false
      so_coerencia:
        description: 'Refaz só a coerência, a partir da análise já gravada'
        type: boolean
        required: false
        default: false
      paralelo:
        description: 'Quantos planos analisar ao mesmo tempo'
        required: false
        default: '3'
      pausa:
        description: 'Segundos entre um plano e outro (5 no TSE, 1 com espelho)'
        required: false
        default: '5'
      limpar:
        description: 'Tirar das abas quem saiu do universo da análise'
        type: choice
        options:
          - ''
          - simular
          - gravar
        default: ''

# Duas execuções gravando na mesma planilha se atrapalham. A fila garante uma de
# cada vez, e a corrente não é cancelada para não jogar fora análise já paga.
#
# É também o motivo de o paralelismo ser DENTRO do job (--paralelo) e não uma
# matrix por UF: `gravar` reescreve a aba inteira, e 27 jobs fazendo isso ao
# mesmo tempo se apagam. Em série, 79 planos em 5h29 na releitura da versão 17,
# com o job morrendo no teto de 5h30. Com três em paralelo, a leva de 207 cabe
# numa execução.
concurrency:
  group: planos-governo
  cancel-in-progress: false

jobs:
  analisar:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # o runner corta em 6h; para antes com folga
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: OCR (planos digitalizados)
        # Sem tesseract, plano escaneado volta vazio e parece que o candidato
        # não escreveu nada.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      # curl_cffi: sem ele o runner leva 403 do WAF do TSE em todo download.
      # google-api-python-client: leitura do espelho dos planos no Drive.
      # pyarrow: cache Parquet das abas que os painéis leem (compartilhado/cache_parquet.py).
      - run: pip install gspread google-auth google-genai PyMuPDF pillow pytesseract pandas pyarrow curl_cffi google-api-python-client

      - name: Escrever credentials.json
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}

      - name: Analisar planos
        env:
          PYTHONUNBUFFERED: "1"     # sem isso o log só aparece no fim
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPREADSHEET_ID_TSE: ${{ secrets.SPREADSHEET_ID_TSE }}
          # A pausa existe para espaçar requisição ao DivulgaCand, que corta
          # sequência longa. Com o espelho do Drive cobrindo os 203 planos, o
          # download não passa mais pelo TSE e os 5 segundos viram só espera.
          PAUSA_ENTRE_PLANOS: ${{ inputs.pausa || '5' }}
        run: |
          python -m outros.processar_planos \
            --cargo TODOS \
            --paralelo ${{ inputs.paralelo || '3' }} \
            ${{ inputs.uf && format('--uf {0}', inputs.uf) || '' }} \
            ${{ inputs.sq && format('--sq {0}', inputs.sq) || '' }} \
            ${{ inputs.forcar == true && '--forcar' || '' }} \
            ${{ inputs.so_coerencia == true && '--so-coerencia' || '' }} \
            ${{ inputs.limpar && format('--limpar-fora-da-base {0}', inputs.limpar) || '' }}

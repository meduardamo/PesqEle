name: 19 - Transcrição de Debates

# Sob demanda, não agendado: debate tem data marcada, e a fila só anda quando
# alguém põe uma linha em 'pendente' na planilha "Mapeamento de Debates"
# (drive compartilhado Eleições 2026 > Debates).
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Teste avulso: transcreve essa URL sem tocar na planilha nem no Drive (vazio = roda a fila normal)'
        required: false
        default: ''
      contexto:
        description: 'Participantes, só no teste avulso (vazio = o padrão do script)'
        required: false
        default: ''
      so_sync:
        description: 'Só puxa o calendário do monitoramento, sem transcrever nada'
        type: boolean
        required: false
        default: false
      reorganizar:
        description: 'Só arruma o Drive: move o que já está lá para UF/ano-mês/dia, sem transcrever'
        type: boolean
        required: false
        default: false
      simular:
        description: 'Com "reorganizar", só lista o que seria movido, sem mover'
        type: boolean
        required: false
        default: false
      id:
        description: 'Roda só esse id da planilha, ignorando o status (vazio = todos os pendentes)'
        required: false
        default: ''
      inicio:
        description: 'Recorte, início em HH:MM:SS (vazio = do começo)'
        required: false
        default: ''
      duracao:
        description: 'Recorte, duração em HH:MM:SS (vazio = tudo). Use 00:10:00 para testar barato'
        required: false
        default: ''
      modelo:
        description: 'Modelo Gemini'
        required: false
        default: 'gemini-3.6-flash'
      raciocinio:
        description: 'Raciocínio: MINIMAL/LOW/MEDIUM/HIGH, um número de tokens (0 desliga) ou vazio para o padrão do modelo'
        required: false
        default: 'MINIMAL'

  # Disparo externo pelo mesmo agendador que já chama os workflows 06, 08 e 15:
  # POST /repos/meduardamo/eixo-eleicoes/dispatches com
  # {"event_type": "transcrever-debates"}. Rodar duas vezes não duplica nada: a
  # fila é só quem está em 'pendente', e o script move para 'processando'
  # assim que pega a linha.
  repository_dispatch:
    types: [transcrever-debates]

# Duas rodadas ao mesmo tempo brigam pela cota da API e pelas mesmas linhas da
# planilha. Não cancela a corrente para não jogar fora bloco já pago.
concurrency:
  group: transcricao-debates
  cancel-in-progress: false

jobs:
  transcrever:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # debate de 2h dá ~12 blocos; a fila pode ter vários
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ffmpeg
        # O ubuntu-latest não traz mais ffmpeg. Sem ele o yt-dlp baixa o vídeo
        # e morre no pós-processamento, com uma mensagem que não diz de quem é
        # a culpa. O `command -v` no fim é o que de fato falha se faltar: um
        # `ffmpeg -version | head -1` devolve o código de saída do head, e
        # passa verde mesmo sem ffmpeg nenhum.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg && command -v ffprobe
          ffmpeg -version | head -1

      - name: Runtime JavaScript para o yt-dlp
        # O yt-dlp descontinuou extração do YouTube sem runtime JS: sem isso ele
        # avisa "No supported JavaScript runtime" e pode perder formatos. O deno
        # é o único habilitado por padrão.
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pip install google-genai yt-dlp gspread google-auth google-api-python-client

      - name: Escrever credentials.json
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Transcrever a fila
        env:
          PYTHONUNBUFFERED: "1"     # sem isso o log só aparece quando o job acaba
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # O env vence o padrão do script, então trocar só o .py não basta: com
          # 2.5-flash aqui a chave nova responde 404 e o run morre na 1a chamada.
          GEMINI_MODEL: ${{ inputs.modelo || 'gemini-3.6-flash' }}
          # O || cobre o repository_dispatch, que não manda input nenhum: sem
          # ele a fila normal chegaria vazia aqui e rodaria com o padrão caro
          # do modelo. Para pedir o padrão do modelo de propósito, use PADRAO.
          GEMINI_THINKING: ${{ inputs.raciocinio || 'MINIMAL' }}
          # Opcional. O YouTube às vezes barra o IP do runner como bot; com o
          # conteúdo de um cookies.txt neste secret o yt-dlp passa.
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          # Repo público: id de planilha e de pasta ficam em secret, como o
          # SPREADSHEET_ID_TSE dos outros workflows.
          SPREADSHEET_ID_DEBATES: ${{ secrets.SPREADSHEET_ID_DEBATES }}
          PASTA_DRIVE_DEBATES: ${{ secrets.PASTA_DRIVE_DEBATES }}
          # Aba 'Debates' da [interno] ELEIÇÕES 2026, mantida pelo monitoramento.
          # É de lá que o calendário vem; sem isso o sync é pulado e a fila
          # roda só com o que já estiver na nossa planilha.
          SPREADSHEET_ID_INTERNO: ${{ secrets.SPREADSHEET_ID_INTERNO }}
          URL: ${{ inputs.url }}
          # Vai por env, e não por argumento, porque contexto tem quebra de
          # linha e no shell isso vira barra-n literal dentro do prompt.
          DEBATE_CONTEXTO: ${{ inputs.contexto }}
        run: |
          RECORTE=""
          ${{ inputs.inicio && format('RECORTE="$RECORTE --inicio {0}"', inputs.inicio) || 'true' }}
          ${{ inputs.duracao && format('RECORTE="$RECORTE --duracao {0}"', inputs.duracao) || 'true' }}

          if [ "${{ inputs.reorganizar }}" = "true" ]; then
            # Só mexe em pasta do Drive: não baixa áudio, não chama o modelo,
            # não escreve na planilha. Rodar duas vezes não faz mal.
            echo "reorganizando o Drive"
            python -m outros.transcricao_debates --reorganizar-drive \
              ${{ inputs.simular == true && '--simular' || '' }}
          elif [ -n "$URL" ]; then
            # Teste avulso: não sincroniza, não escreve na planilha, não sobe
            # para o Drive. Só o artefato do run, para conferir qualidade.
            echo "modo avulso: planilha e Drive intocados"
            python -m outros.transcricao_debates --url "$URL" --nome teste $RECORTE
          else
            python -m outros.transcricao_debates --fila $RECORTE \
              ${{ inputs.so_sync == true && '--so-sync' || '' }} \
              ${{ inputs.id && format('--id {0}', inputs.id) || '' }}
          fi

      - name: Resumo na página do run
        if: always()
        run: |
          {
            echo "## Transcrição de debates"
            echo ""
            echo "Fila e links de saída na planilha Mapeamento de Debates (drive Eleições 2026 > Debates)."
            echo ""
            if compgen -G "transcricoes/**/*.txt" > /dev/null || compgen -G "transcricoes/*.txt" > /dev/null; then
              echo "| arquivo | tamanho | falas |"
              echo "|---|---|---|"
              for f in $(find transcricoes -name '*.txt' 2>/dev/null); do
                echo "| $(basename "$f") | $(du -h "$f" | cut -f1) | $(wc -l < "$f") |"
              done
            else
              echo "Nenhuma transcrição gerada. Veja o log do passo anterior."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar arquivos
        # Cópia de segurança do que já foi para o Drive, com o _bruto.md para
        # conferência. Some em 30 dias; o que fica é o Drive.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcricoes-${{ github.run_number }}
          path: transcricoes/
          retention-days: 30
          if-no-files-found: warn
